<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Portfolio - About</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Lato", Arial, sans-serif;
}


/* =========================
   NAVIGATION
   ========================= */

.sidenav {
    position: fixed;
    top: 0;
    left: 0;

    width: 200px;
    height: 100%;

    padding-top: 20px;

    overflow-x: hidden;

    background: transparent;

    z-index: 10;
}

.sidenav a {
    display: block;

    padding: 6px 6px 6px 32px;

    text-decoration: none;

    font-size: 25px;

    color: #000;
}

.sidenav a:hover {
    color: #F54927;
}


/* =========================
   NAME
   ========================= */

.sidenav .logo {
    color: #F54927;
    line-height: 1;
}


/* =========================
   MAIN CONTENT
   ========================= */

.main {
    margin-left: 200px;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px;

    transform: translateX(-100px);
}


/* =========================
   INTRO
   ========================= */

.intro {
    max-width: 700px;

    text-align: center;

    font-size: 28px;

    font-weight: 300;

    line-height: 1.6;

    color: #333;
}

.intro a {
    color: #F54927;

    text-decoration: none;
}

.intro a:hover {
    text-decoration: underline;
}


/* =========================
   MOBILE
   ========================= */

@media screen and (max-width: 768px) {

    .sidenav {
        position: relative;

        width: 100%;
        height: auto;

        display: flex;

        justify-content: center;

        flex-wrap: wrap;

        padding-top: 10px;
    }


    .sidenav a {
        font-size: 18px;

        padding: 10px;
    }


    .sidenav .logo {
        line-height: 1;
    }


    .main {
        margin-left: 0;

        min-height: auto;

        padding: 60px 25px;

        transform: none;
    }


    .intro {
        font-size: 22px;

        line-height: 1.5;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVIGATION
     ========================= -->

<div class="sidenav">

    <a class="logo">
        Lachlan<br>Biewer
    </a>

    <a href="2dGraphics.html">
        2D Graphics
    </a>

    <a href="index.html">
        About
    </a>

    <a href="Contact.html">
        Contact
    </a>

</div>


<!-- =========================
     MAIN CONTENT
     ========================= -->

<div class="main">

    <h2 class="intro">

        Hello! I'm Lachlan. I've dedicated several years to the art of graphic design, transforming ideas into visual experiences. Illustrations are at the heart of my work, with a primary focus on <a href="2dGraphics.html">apparel and poster</a> designs.

    </h2>

</div>


</body>

</html>
